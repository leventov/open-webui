# fly.toml app configuration file generated for pocketopenwebui on 2025-09-27T22:09:41+04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

# app name is intentionally omitted; pass --app on deploy
primary_region = 'sin'

[deploy]
  ha = false

[env]
  ENABLE_INITIAL_ADMIN_SIGNUP = 'True'
  HOST = '0.0.0.0'
  PORT = '8080'
  WEBUI_AUTH = 'True'
  BYPASS_EMBEDDING_AND_RETRIEVAL = 'True'
  ENABLE_BASE_MODELS_CACHE = 'False'
  RAG_EMBEDDING_MODEL = ''
  RAG_EMBEDDING_MODEL_AUTO_UPDATE = 'False'
  RAG_EMBEDDING_ENGINE = 'openai'
  # Extend model list timeout to tolerate bifrost cold starts
  AIOHTTP_CLIENT_TIMEOUT_OPENAI_MODEL_LIST = '30'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '90s'
    interval = '15s'
    method = 'get'
    path = '/health'
    timeout = '14s'

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[mounts]]
  source = 'owui_data'
  destination = '/app/backend/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2
